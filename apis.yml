aid: genmo-ai
url: https://raw.githubusercontent.com/api-evangelist/genmo-ai/refs/heads/main/apis.yml
name: Genmo
kind: company
description: >-
  Genmo is a San Francisco research lab building open-source video generation
  models. Its flagship release, Mochi 1, is an Apache-2.0 licensed 10B-parameter
  text-to-video diffusion model (AsymmDiT architecture) with strong prompt
  adherence and high-fidelity motion. Genmo does NOT publish a first-party hosted
  developer REST API. Programmatic access to Mochi comes in three honest forms:
  (1) the open-source model itself, self-hosted via the repo's Python pipeline
  ("simple composable API"), CLI, Gradio UI, or ComfyUI; (2) third-party hosted
  inference APIs from partners such as Replicate and fal.ai; and (3) a
  credit-based consumer web app and Playground at genmo.ai/play. The endpoints
  documented here for hosted access are modeled from partner documentation and
  are not operated by Genmo.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Video Generation
- AI Video
- Generative AI
